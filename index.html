<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday, Bestie! 🎉</title>
  <meta name="description" content="A birthday surprise for the best friend ever!">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:ital,wght@0,400;0,700;0,800;0,900;1,400&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Music -->
  <audio id="bg-audio" loop>
    <!-- Happy Birthday – public domain (Wikimedia Commons) -->
    <source src="https://upload.wikimedia.org/wikipedia/commons/transcoded/3/35/Happy_birthday_to_you.ogg/Happy_birthday_to_you.ogg.mp3" type="audio/mpeg">
    <source src="https://upload.wikimedia.org/wikipedia/commons/3/35/Happy_birthday_to_you.ogg" type="audio/ogg">
  </audio>

  <!-- Confetti / particle overlay — always on top -->
  <canvas id="particles-canvas"></canvas>

  <!-- =====================================================================
       LANDING — single full-screen canvas (balloon + bow in one coordinate system)
       ===================================================================== -->
  <canvas id="landing-canvas"></canvas>

  <!-- =====================================================================
       DEMO WRAPPER — revealed after landing transition
       ===================================================================== -->
  <div id="demo-wrapper" class="hidden">
    <div class="demo-container">
      <iframe src="bestie.html" title="Birthday surprise for my best friend" allow="autoplay"></iframe>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
