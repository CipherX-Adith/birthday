<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday, Bestie! 🎉</title>
  <meta name="description" content="A birthday surprise for the best friend ever!">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:ital,wght@0,400;0,700;0,800;0,900;1,400&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Music -->
  <audio id="bg-audio" loop preload="auto" autoplay>
    <source src="sub_clair-happy-birthday-592177.mp3" type="audio/mpeg">
  </audio>

  <!-- Floating Speaker / Audio Control Widget -->
  <button id="btn-audio" class="audio-control-widget widget-show is-playing" type="button" aria-label="Toggle background music" title="Click to silent / turn off music">
    <div class="speaker-icon-wrap" id="disc">
      <i class="fa-solid fa-volume-high" id="speaker-icon"></i>
    </div>
    <div class="audio-widget-content">
      <div class="audio-wave" id="audio-wave" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="track-info">
        <span class="track-status t-status" id="track-status">Music Playing</span>
        <span class="track-name">Happy Birthday 🎂</span>
      </div>
    </div>
  </button>

  <!-- Confetti / particle overlay — always on top -->
  <canvas id="particles-canvas"></canvas>

  <!-- =====================================================================
       LANDING — single full-screen canvas (balloon + bow in one coordinate system)
       ===================================================================== -->
  <canvas id="landing-canvas"></canvas>

  <!-- =====================================================================
       DEMO WRAPPER — revealed after landing transition
       ===================================================================== -->
  <div id="demo-wrapper" class="hidden">
    <div class="demo-container">
      <iframe src="bestie.html" title="Birthday surprise for my best friend" allow="autoplay"></iframe>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
