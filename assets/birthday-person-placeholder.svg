<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="gold-grad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#FFF3D4" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </radialGradient>
    <linearGradient id="stem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#7A0E2E" />
    </linearGradient>
  </defs>
  <!-- Background soft radial glow -->
  <circle cx="250" cy="250" r="230" fill="#FAF7F0" opacity="0.9" />
  
  <!-- Outer Gold Frame -->
  <circle cx="250" cy="250" r="225" fill="none" stroke="url(#gold-grad)" stroke-width="3" stroke-dasharray="8 4" />
  <circle cx="250" cy="250" r="218" fill="none" stroke="url(#gold-grad)" stroke-width="1" />
  
  <!-- Minimalist Floral Line Art in Gold/Burgundy -->
  <g transform="translate(150, 80) scale(1.1)">
    <!-- Main stem -->
    <path d="M 90 280 Q 95 180 80 80" fill="none" stroke="url(#stem-grad)" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Leaves -->
    <path d="M 85 220 Q 50 200 40 180 Q 60 175 84 200" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round" />
    <path d="M 84 170 Q 120 150 130 130 Q 110 125 82 150" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round" />
    <path d="M 82 130 Q 45 110 35 90 Q 55 85 80 110" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round" />
    
    <!-- Bud 1 -->
    <path d="M 80 80 C 65 60 70 30 80 20 C 90 30 95 60 80 80 Z" fill="url(#gold-grad)" opacity="0.85" />
    <path d="M 80 80 C 65 60 70 30 80 20 C 90 30 95 60 80 80 Z" fill="none" stroke="#7A0E2E" stroke-width="1.5" />
    
    <!-- Blossom 1 -->
    <path d="M 40 180 C 25 170 20 150 30 140 C 40 130 55 155 40 180 Z" fill="url(#gold-grad)" opacity="0.75" />
    <path d="M 130 130 C 145 120 150 100 140 90 C 130 80 115 105 130 130 Z" fill="url(#gold-grad)" opacity="0.75" />
  </g>
  
  <!-- Ornate bottom ornament -->
  <path d="M 210 440 C 230 445 270 445 290 440" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="250" cy="441" r="3" fill="#7A0E2E" />
</svg>
